# Standalone X-Client: in-memory ledger, no Fabric-X network required.
# For the 3-organization deployment against devnet-3org see docker-compose.3org.yaml.

services:
  x-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x-client
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    command: ["-config", "/app/config/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
