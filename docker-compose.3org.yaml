# One X-Client per organization, joined to the fabric-x-samples/devnet-3org network
# ("fabric-x"). Start the devnet with `make start-3org` and run ./scripts/copy-crypto.sh first.
#
# Each container mounts only its own private keys plus the public CA certificates.
# The Central Bank co-signs every transaction; banks reach it at x-client-centralbank:8080.

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # Run as the host user so the mounted keys (mode 600) are readable, as devnet does.
  user: "${UID:-1000}:${GID:-1000}"
  networks:
    - fabric-x

x-routers: &routers
  ROUTER1: orderer-party1-router:7050
  ROUTER2: orderer-party2-router:7150
  ROUTER3: orderer-party3-router:7250
  ROUTER4: orderer-party4-router:7350

services:
  x-client-centralbank:
    <<: *common
    container_name: x-client-centralbank
    command: ["-config", "/app/config/centralbank.yaml"]
    ports:
      - "8080:8080"
    environment:
      <<: *routers
      PORT: "8080"
      QS_ENDPOINT: committer-cb-query-service:7001
      SIDECAR_ENDPOINT: committer-cb-sidecar:4001
      PEER_ORG1: http://x-client-bank-a:8081
      PEER_ORG2: http://x-client-bank-b:8082
    volumes:
      - ./crypto/centralbank:/app/crypto/centralbank:ro
      - ./crypto/cas:/app/crypto/cas:ro
      - ./crypto/orderer-tls:/app/crypto/orderer-tls:ro

  x-client-bank-a:
    <<: *common
    container_name: x-client-bank-a
    command: ["-config", "/app/config/bank_a.yaml"]
    ports:
      - "8081:8081"
    environment:
      <<: *routers
      PORT: "8081"
      QS_ENDPOINT: committer-query-service:7001
      SIDECAR_ENDPOINT: committer-sidecar:4001
      PEER_CB: http://x-client-centralbank:8080
    volumes:
      - ./crypto/bank_a:/app/crypto/bank_a:ro
      - ./crypto/cas:/app/crypto/cas:ro
      - ./crypto/orderer-tls:/app/crypto/orderer-tls:ro

  x-client-bank-b:
    <<: *common
    container_name: x-client-bank-b
    command: ["-config", "/app/config/bank_b.yaml"]
    ports:
      - "8082:8082"
    environment:
      <<: *routers
      PORT: "8082"
      QS_ENDPOINT: committer-org2-query-service:7001
      SIDECAR_ENDPOINT: committer-org2-sidecar:4001
      PEER_CB: http://x-client-centralbank:8080
    volumes:
      - ./crypto/bank_b:/app/crypto/bank_b:ro
      - ./crypto/cas:/app/crypto/cas:ro
      - ./crypto/orderer-tls:/app/crypto/orderer-tls:ro

networks:
  # Created by devnet-3org (compose.yaml: networks.fabric-x.name = fabric-x).
  fabric-x:
    name: fabric-x
    external: true
