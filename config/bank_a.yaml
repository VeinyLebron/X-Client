# Bank A (Org1MSP) Endorser Client Configuration

server:
  port: 8081
  host: "0.0.0.0"

# Mode: "grpc" to connect to Fabric-X Query Service, or "in-memory" for mock
mode: "grpc"

# Connection to Fabric-X Query Service container
query_service:
  endpoint: "localhost:7001" # In Docker network: "committer-query-service:7001"
  tls:
    enabled: false # Set to true if Fabric-X devnet has TLS enabled
    ca_cert: "crypto/bank_a/ca.crt"
    client_cert: "crypto/bank_a/cert.pem"
    client_key: "crypto/bank_a/priv_sk"

default_msp_id: "Org1MSP"

endorsers:
  Org1MSP:
    msp_id: "Org1MSP"
    cert_path: "crypto/bank_a/cert.pem"
    key_path: "crypto/bank_a/priv_sk"

namespaces:
  public: "cbdc_public"
  central_bank_pdc: "cbdc_cb_pdc"
