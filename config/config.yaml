# Standalone X-Client: in-memory ledger, one process holding throwaway keys for both
# organizations. Transactions are fully endorsed and committed locally, so the complete
# CBDC flow works without a Fabric-X network. The X-Caller-MSP header picks the acting
# organization (default Org1MSP). For the real network use org1.yaml and org2.yaml.

server:
  host: "0.0.0.0"
  port: ${PORT:-8080}
  api_token: "${API_TOKEN:-}"

mode: "in-memory"
channel_id: "mychannel"
central_bank_msp: "Org1MSP"
default_msp_id: "Org1MSP"
allow_caller_header: true

namespaces:
  public: "cbdc_public"
  central_bank_pdc: "cbdc_cb_pdc"
  credits: "cbdc_credits"
  banks:
    Org1MSP: "cbdc_org1_pdc"
    Org2MSP: "cbdc_org2_pdc"
