# Standalone X-Client: in-memory ledger, one process holding throwaway keys for all
# three organizations. Transactions are fully endorsed and committed locally, so the
# complete CBDC flow works without a Fabric-X network. The X-Caller-MSP header picks
# the acting organization. For the real network use centralbank.yaml, bank_a.yaml and
# bank_b.yaml against fabric-x-samples/devnet-3org.

server:
  host: "0.0.0.0"
  port: ${PORT:-8080}
  api_token: "${API_TOKEN:-}"

mode: "in-memory"
channel_id: "mychannel"
default_msp_id: "CentralBankMSP"
allow_caller_header: true

namespaces:
  public: "cbdc_public"
  central_bank_pdc: "cbdc_cb_pdc"
  credits: "cbdc_credits"
  banks:
    Org1MSP: "cbdc_org1_pdc"
    Org2MSP: "cbdc_org2_pdc"
