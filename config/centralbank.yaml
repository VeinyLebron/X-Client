# Central Bank (CentralBankMSP) X-Client for fabric-x-samples/devnet-3org.
# Co-signs every CBDC transaction. Defaults target the devnet from the host; the
# ${VAR:-default} references are overridden by docker-compose.3org.yaml.

server:
  host: "0.0.0.0"
  port: ${PORT:-8080}
  api_token: "${API_TOKEN:-}"

mode: "grpc"
channel_id: "mychannel"
default_msp_id: "CentralBankMSP"

endorsers:
  CentralBankMSP:
    cert_path: "crypto/centralbank/cert.pem"
    key_path: "crypto/centralbank/priv_sk"

# The Central Bank's own committer stack (compose.centralbank.yaml).
query_service:
  endpoint: "${QS_ENDPOINT:-localhost:7003}"
  tls: &cb_tls
    mode: "mtls"
    ca_cert_paths: ["crypto/centralbank/tls/ca.crt"]
    cert_path: "crypto/centralbank/tls/client.crt"
    key_path: "crypto/centralbank/tls/client.key"
sidecar:
  endpoint: "${SIDECAR_ENDPOINT:-localhost:4003}"
  tls: *cb_tls

orderers: &orderers
  - endpoint: "${ROUTER1:-localhost:7050}"
    tls: &router_tls
      mode: "mtls"
      ca_cert_paths: ["crypto/orderer-tls/orderer-org-1.pem", "crypto/orderer-tls/orderer-org-2.pem", "crypto/orderer-tls/orderer-org-3.pem", "crypto/orderer-tls/orderer-org-4.pem"]
      cert_path: "crypto/centralbank/tls/client.crt"
      key_path: "crypto/centralbank/tls/client.key"
  - endpoint: "${ROUTER2:-localhost:7150}"
    tls: *router_tls
  - endpoint: "${ROUTER3:-localhost:7250}"
    tls: *router_tls
  - endpoint: "${ROUTER4:-localhost:7350}"
    tls: *router_tls
commit_timeout: 30s

# Banks that may ask this node to co-sign. msp_ca authenticates their requests.
peers:
  Org1MSP:
    endpoint: "${PEER_ORG1:-http://localhost:8081}"
    msp_ca: "crypto/cas/Org1MSP.pem"
  Org2MSP:
    endpoint: "${PEER_ORG2:-http://localhost:8082}"
    msp_ca: "crypto/cas/Org2MSP.pem"

# Must match devnet-3org `make init-namespace-cbdc`.
namespaces:
  public: "cbdc_public"
  central_bank_pdc: "cbdc_cb_pdc"
  credits: "cbdc_credits"
  banks:
    Org1MSP: "cbdc_org1_pdc"
    Org2MSP: "cbdc_org2_pdc"
