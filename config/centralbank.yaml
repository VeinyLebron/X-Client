# Central Bank (CentralBankMSP) Endorser Client Configuration

server:
  port: 8080
  host: "0.0.0.0"

# Mode: "grpc" to connect to Fabric-X Query Service, or "in-memory" for mock
mode: "grpc"

# Connection to Fabric-X Query Service container
query_service:
  endpoint: "localhost:7001" # In Docker network: "committer-query-service:7001"
  tls:
    enabled: false # Set to true if Fabric-X devnet has TLS enabled
    ca_cert: "crypto/centralbank/ca.crt"
    client_cert: "crypto/centralbank/cert.pem"
    client_key: "crypto/centralbank/priv_sk"

default_msp_id: "CentralBankMSP"

endorsers:
  CentralBankMSP:
    msp_id: "CentralBankMSP"
    cert_path: "crypto/centralbank/cert.pem"
    key_path: "crypto/centralbank/priv_sk"

namespaces:
  public: "cbdc_public"
  central_bank_pdc: "cbdc_cb_pdc"
